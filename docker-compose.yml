version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - USE_MOCK_DATA=false
    volumes:
      - ./:/app
      - /app/node_modules

  dev:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - USE_MOCK_DATA=false  # Defina como true para usar dados mockados
      - DISPLAY=$DISPLAY     # Compartilhar o display para mostrar o navegador
    volumes:
      - ./:/app
      - /app/node_modules
      - /tmp/.X11-unix:/tmp/.X11-unix  # Compartilhar o X11 socket para UI
    command: npm run dev